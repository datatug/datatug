{
  "titles": {
    "en": "Public Data Fabric evidence"
  },
  "record_file": {
    "name": "{key}.json",
    "format": "json",
    "type": "map[string]any"
  },
  "columns": {
    "title": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "observed_at": {
      "type": "datetime",
      "required": true
    },
    "outcome": {
      "type": "string",
      "required": true,
      "enum": [
        "pass",
        "fail",
        "partial",
        "observation",
        "decision",
        "pending"
      ]
    },
    "summary": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "repository": {
      "type": "string"
    },
    "commit": {
      "type": "string",
      "length": 40
    },
    "path": {
      "type": "string"
    },
    "command": {
      "type": "string"
    },
    "reviewer": {
      "type": "string"
    },
    "independent": {
      "type": "bool"
    },
    "url": {
      "type": "string"
    },
    "review_stage": {
      "type": "string",
      "enum": [
        "foundation",
        "reconciliation",
        "portfolio",
        "implementation",
        "launch"
      ]
    }
  },
  "columns_order": [
    "title",
    "observed_at",
    "outcome",
    "summary",
    "repository",
    "commit",
    "path",
    "command",
    "reviewer",
    "independent",
    "url",
    "review_stage"
  ]
}
