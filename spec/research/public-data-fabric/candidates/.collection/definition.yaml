{
  "titles": {
    "en": "Public Data Fabric candidates"
  },
  "record_file": {
    "name": "{key}.json",
    "format": "json",
    "type": "map[string]any"
  },
  "columns": {
    "title": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "evidence_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.evidence"
    },
    "kind": {
      "type": "string",
      "required": true,
      "enum": [
        "meaning",
        "source",
        "dataset",
        "recordset",
        "scenario",
        "bundle"
      ]
    },
    "status": {
      "type": "string",
      "required": true,
      "enum": [
        "discovered",
        "screened",
        "researched",
        "promising",
        "reconciled",
        "selected",
        "implementing",
        "implemented",
        "validated",
        "blocked",
        "needs-review",
        "low-priority",
        "rejected"
      ]
    },
    "reason": {
      "type": "string"
    },
    "dependency_ids": {
      "type": "[]string",
      "foreign_key": "fabric.candidates"
    },
    "source_id": {
      "type": "string",
      "foreign_key": "fabric.candidates"
    },
    "dataset_id": {
      "type": "string",
      "foreign_key": "fabric.candidates"
    },
    "member_ids": {
      "type": "[]string",
      "foreign_key": "fabric.candidates"
    },
    "demo_ids": {
      "type": "[]string",
      "foreign_key": "fabric.candidates"
    },
    "identifier_representations": {
      "type": "[]string"
    },
    "canonical_address": {
      "type": "string"
    },
    "repository": {
      "type": "string"
    },
    "commit": {
      "type": "string",
      "length": 40
    },
    "source_url": {
      "type": "string"
    },
    "licence": {
      "type": "string"
    },
    "licence_notes": {
      "type": "string"
    },
    "geographic_coverage": {
      "type": "string"
    },
    "temporal_coverage": {
      "type": "string"
    },
    "update_frequency": {
      "type": "string"
    },
    "observed_at": {
      "type": "datetime"
    },
    "revalidate_after": {
      "type": "datetime"
    },
    "freshness": {
      "type": "string",
      "enum": [
        "unknown",
        "current",
        "stale",
        "needs-review"
      ]
    },
    "practical_value": {
      "type": "string"
    },
    "showcase_value": {
      "type": "string"
    },
    "research_depth": {
      "type": "string",
      "enum": [
        "shallow",
        "documented",
        "sampled",
        "unknown"
      ]
    }
  },
  "columns_order": [
    "title",
    "evidence_ids",
    "kind",
    "status",
    "reason",
    "research_depth",
    "dependency_ids",
    "source_id",
    "dataset_id",
    "member_ids",
    "demo_ids",
    "identifier_representations",
    "canonical_address",
    "repository",
    "commit",
    "source_url",
    "licence",
    "licence_notes",
    "geographic_coverage",
    "temporal_coverage",
    "update_frequency",
    "observed_at",
    "revalidate_after",
    "freshness",
    "practical_value",
    "showcase_value"
  ]
}
