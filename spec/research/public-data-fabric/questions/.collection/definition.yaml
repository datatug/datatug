{
  "titles": {
    "en": "Public Data Fabric questions"
  },
  "record_file": {
    "name": "{key}.json",
    "format": "json",
    "type": "map[string]any"
  },
  "columns": {
    "title": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "evidence_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.evidence"
    },
    "status": {
      "type": "string",
      "required": true,
      "enum": [
        "open",
        "resolved",
        "declined"
      ]
    },
    "classification": {
      "type": "string",
      "required": true,
      "enum": [
        "blocking",
        "important/non-blocking",
        "unrelated improvement"
      ]
    },
    "owner": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "candidate_ids": {
      "type": "[]string",
      "foreign_key": "fabric.candidates"
    },
    "resolution": {
      "type": "string"
    },
    "gate_ids": {
      "type": "[]string",
      "foreign_key": "fabric.gates"
    }
  },
  "columns_order": [
    "title",
    "evidence_ids",
    "status",
    "classification",
    "owner",
    "candidate_ids",
    "resolution",
    "gate_ids"
  ]
}
