{
  "titles": {
    "en": "Public Data Fabric implementation"
  },
  "record_file": {
    "name": "{key}.json",
    "format": "json",
    "type": "map[string]any"
  },
  "columns": {
    "title": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "evidence_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.evidence"
    },
    "candidate_id": {
      "type": "string",
      "required": true,
      "foreign_key": "fabric.candidates"
    },
    "status": {
      "type": "string",
      "required": true,
      "enum": [
        "planned",
        "implementing",
        "implemented",
        "validated",
        "blocked"
      ]
    },
    "owner": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "canonical_address": {
      "type": "string"
    },
    "repository": {
      "type": "string"
    },
    "commit": {
      "type": "string",
      "length": 40
    },
    "publication_evidence_ids": {
      "type": "[]string",
      "foreign_key": "fabric.evidence"
    },
    "query_evidence_ids": {
      "type": "[]string",
      "foreign_key": "fabric.evidence"
    },
    "reason": {
      "type": "string"
    }
  },
  "columns_order": [
    "title",
    "evidence_ids",
    "candidate_id",
    "status",
    "owner",
    "canonical_address",
    "repository",
    "commit",
    "publication_evidence_ids",
    "query_evidence_ids",
    "reason"
  ]
}
