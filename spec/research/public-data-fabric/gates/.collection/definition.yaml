{
  "titles": {
    "en": "Public Data Fabric gates"
  },
  "record_file": {
    "name": "{key}.json",
    "format": "json",
    "type": "map[string]any"
  },
  "columns": {
    "title": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "status": {
      "type": "string",
      "required": true,
      "enum": [
        "pending",
        "passed"
      ]
    },
    "owner": {
      "type": "string",
      "required": true,
      "min_length": 1
    },
    "prerequisite_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.gates"
    },
    "requirements": {
      "type": "[]string",
      "required": true,
      "min_length": 1
    },
    "evidence_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.evidence"
    },
    "blocker_ids": {
      "type": "[]string",
      "required": true,
      "foreign_key": "fabric.questions"
    },
    "decision": {
      "type": "string",
      "required": true,
      "min_length": 1
    }
  },
  "columns_order": [
    "title",
    "status",
    "owner",
    "prerequisite_ids",
    "requirements",
    "evidence_ids",
    "blocker_ids",
    "decision"
  ]
}
